name: do-over

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_PRO_PREVIEW: ${NEXT_PUBLIC_PRO_PREVIEW:-true}
    image: do-over-web:${GIT_SHA:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      LLM_PRIMARY: ${LLM_PRIMARY:-openai}
      MODEL_DAILY_CALL_CAP: ${MODEL_DAILY_CALL_CAP:-20000}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-}
      NEXT_PUBLIC_PRO_PREVIEW: ${NEXT_PUBLIC_PRO_PREVIEW:-true}
      ADMIN_KEY: ${ADMIN_KEY:-}
      GIT_SHA: ${GIT_SHA:-local}
    depends_on:
      redis:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_started
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  redis-data:
  caddy-data:
  caddy-config:
