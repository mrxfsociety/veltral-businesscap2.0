server {
    listen 80;
    listen [::]:80;
    server_name veltral.aituconnect.kz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/do-over-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name veltral.aituconnect.kz;
    ssl_certificate /etc/letsencrypt/live/veltral.aituconnect.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veltral.aituconnect.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 2m;
    access_log /var/log/nginx/do-over.access.log;
    error_log /var/log/nginx/do-over.error.log;
    location / {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
