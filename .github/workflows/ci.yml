name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_PRO_PREVIEW: "true"
      GIT_SHA: ${{ github.sha }}
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: bash -n scripts/deploy.sh
      - run: docker compose --env-file .env.example config --quiet
      - run: npm run verify

  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and check the standalone container
        env:
          DOMAIN: http://localhost
          SITE_URL: http://localhost
        run: |
          cp .env.example .env
          ./scripts/deploy.sh --no-pull
      - name: Container status
        if: always()
        run: docker compose ps
      - name: Stop smoke-test containers
        if: always()
        run: docker compose down --volumes
