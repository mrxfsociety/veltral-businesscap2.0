name: Resolve initial dependency lock
on:
  push:
    branches: [t0-foundation]
    paths: [package.json, .github/workflows/bootstrap-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install --package-lock-only --ignore-scripts
      - name: Record resolved dependency versions
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: lock initial dependency versions'
          git push origin HEAD:t0-foundation
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
